[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# The distribution name, which is not the import name. `ziptz` on PyPI is a
# 2013-era registration with no files ever attached to it -- `pip install
# ziptz` fails for everyone -- and PEP 541 is the only route to it, measured in
# months. The `-us` is accurate rather than apologetic: this resolves US ZIP
# codes and nothing else. The package still imports as `ziptz`.
name = "ziptz-us"
version = "0.1.1"
description = "US ZIP code to IANA time zone, standard library only"
requires-python = ">=3.9"
# A PyPI-facing description rather than the repository README, which leads
# with Go and is right to: this page is reached by "pip install ziptz-us" and
# should read like a Python package. The long one on GitHub stays canonical
# and covers both implementations; this is deliberately short so there is
# little to drift.
readme = "README-pypi.md"
# PEP 639. The table form and the License:: classifier are both deprecated
# with a removal date of 2027-02-18, and the argument for keeping them -- that
# PEP 639 needs setuptools 77 where this asked for 61 -- was wrong: that floor
# is for the *build* environment, which pip and python -m build populate with
# the latest setuptools regardless. The build was already running on 77+ and
# already warning. requires-python is untouched; 3.9 still installs this.
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "cho", email = "choey2k5@gmail.com" }]
# What someone would actually type into a search box looking for this.
keywords = ["zip", "zipcode", "postal", "timezone", "time-zone", "tz", "iana", "olson", "usa"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Localization",
    "Topic :: Utilities",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/choey/ziptz"
Repository = "https://github.com/choey/ziptz"
Issues = "https://github.com/choey/ziptz/issues"

# The package is this directory: ziptz.py holds the library and __init__.py
# hands through to it, so a clone can import the directory and a copy of
# ziptz.py can stand alone. Spelled out because the layout is neither of the
# two setuptools guesses at.
[tool.setuptools]
packages = ["ziptz"]

[tool.setuptools.package-dir]
ziptz = "."

# The shared cases go with the test module that reads them, so an installed
# copy can still prove itself -- `python3 -m unittest ziptz.test_ziptz`. Go
# ships its tests to whoever fetches the module too; this keeps that even.
[tool.setuptools.package-data]
ziptz = ["testdata/*.json", "py.typed"]
