# Runs what the README tells a contributor to run, on every push and pull
# request. Nothing here is clever: if it does not match `make test` locally,
# the local one is the definition and this is wrong.
name: test

on:
  push:
  pull_request:

jobs:
  test:
    # The floor and the ceiling. The floor is what the project says it needs --
    # go.mod says 1.21 and pyproject says 3.9 -- and is where a syntax or
    # stdlib slip shows up. The ceiling is where a deprecation shows up first.
    # There is no platform axis: this library reads no files, opens no sockets
    # and calls nothing but the standard library, so the only OS-dependent
    # thing it touches is the tz database, and Location's behaviour there is
    # covered by the cases rather than by the runner.
    strategy:
      fail-fast: false
      matrix:
        include:
          - go: "1.21"
            python: "3.9"
          - go: "stable"
            python: "3.13"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: gofmt
        # gofmt prints the files it would change and says nothing otherwise, so
        # any output at all is the failure.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would rewrite:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: compile the Python side
        run: python3 -m compileall -q ziptz.py __init__.py test_ziptz.py tools

      # The annotations are shipped, so they are a promise to callers rather
      # than a comment: --strict is what keeps them true. It has already caught
      # one -- abbrev() returning tzinfo.tzname()'s Optional through a -> str.
      - name: mypy
        run: |
          pip install mypy
          mypy --strict ziptz.py

      # Both suites, the text-level parity of the two generated tables, and the
      # sweep -- every ZIP there is, through both libraries, compared.
      - name: make test
        run: make test

  # The wheel is what most people will actually get, and it is the only form
  # where the package layout, the test data and NOTICE can be wrong without any
  # of the above noticing.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - name: the metadata PyPI will render
        run: twine check dist/*
      - name: what landed in the wheel
        run: |
          python - <<'PY'
          import pathlib, zipfile
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          names = zipfile.ZipFile(wheel).namelist()
          print("\n".join(sorted(names)))
          # py.typed is the one of these that is silent when it goes missing:
          # the package still installs and still works, it just stops being
          # typed, and nothing but this notices.
          for want in ("ziptz/ziptz.py", "ziptz/testdata/cases.json", "ziptz/py.typed"):
              assert want in names, f"missing from the wheel: {want}"
          # NOTICE carries the ODbL attribution; a wheel without it is a
          # redistribution that dropped something it has to keep.
          assert any(n.endswith("NOTICE") for n in names), "missing from the wheel: NOTICE"
          assert any(n.endswith("LICENSE") for n in names), "missing from the wheel: LICENSE"
          PY
      - name: the installed copy proves itself
        run: |
          pip install dist/*.whl
          cd /tmp && python -m unittest ziptz.test_ziptz
